        <div class="furniture">
            <figure>
                <img src="./img/filing-cabinet.svg" alt="Kommode" title="Kommode" width="150">

            <figure>
                <img src="./img/desk.svg" alt="Schreibtisch" title="Schreibtisch" width="150">

            </figure>
            <figure>
                <img src="./img/chair.svg" alt="Stuhl" title="Stuhl" width="150">
